{% csrf_token %}
{% if form.non_field_errors %}
  <div class="alert alert-danger">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
{% endif %}
{% for campo in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text">{{ campo.help_text|safe }}</div>{% endif %}
    {% for e in campo.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
